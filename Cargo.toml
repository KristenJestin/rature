[package]
name = "rature"
version = "0.1.0"
edition = "2024"
# The code needs 1.88 (let chains); merman 0.10.0-alpha.2 and its crates declare 1.95.
rust-version = "1.95"
description = "A keyboard-first Markdown reader for Linux that follows a file's changes and edits it in place"
license = "AGPL-3.0-only"
repository = "https://github.com/KristenJestin/rature"
readme = "README.md"
publish = false

[dependencies]
csv = "1.4.0"
dprint-plugin-markdown = "0.29.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui-design-system = { git = "https://github.com/KristenJestin/gpui-design-system", tag = "v0.1.0" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "gpui-fast"] }
ignore = "0.4.34"
markdown = "1"
merman = { version = "=0.10.0-alpha.2", default-features = false, features = ["all-diagrams", "complete-svg"] }
notify = { version = "8", default-features = false }
nucleo-matcher = "0.3.1"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "0.8"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
yaml-rust2 = "0.13.0"

