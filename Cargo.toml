[package]
name = "rature"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
dprint-plugin-markdown = "0.29.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "gpui-fast"] }
ignore = "0.4.34"
markdown = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
notify = { version = "8", default-features = false }
nucleo-matcher = "0.3.1"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "0.8"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
yaml-rust2 = "0.13.0"
